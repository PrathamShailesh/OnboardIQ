services:
  - type: web
    name: onboardiq-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onboardiq-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.onrender.com
      - key: PYTHON_VERSION
        value: 3.9.0

databases:
  - name: onboardiq-db
    databaseName: onboardiq
    user: onboardiq_user
